services:
  - type: web
    name: biolink-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --retries 10 --timeout 100 -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: USE_OFFLINE_FALLBACK
        value: "true"
