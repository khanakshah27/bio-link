version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: biolink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: biolink
      POSTGRES_PASSWORD: biolink
      POSTGRES_DB: biolink
    ports:
      - "5432:5432"
    volumes:
      - biolink_pgdata:/var/lib/postgresql/data

volumes:
  biolink_pgdata:
